name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Тесты и сборка бандла
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Тесты
        working-directory: app
        run: node --test
      - name: Сборка бандла (проверка лимита метаданных)
        run: scripts/pack.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle
          path: build/*.tgz
          retention-days: 14

  web:
    name: Интерфейс (Preact + TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Проверка типов
        working-directory: web
        run: npm run typecheck
      - name: Сборка
        working-directory: web
        run: npm run build
      - name: Публичный фронт (минификация, чанки, без комментариев)
        working-directory: web
        run: npm run build:public

  terraform:
    name: OpenTofu validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
      - name: Бандлы нужны модулю (filebase64)
        run: scripts/pack.sh
      - name: fmt
        working-directory: terraform
        run: tofu fmt -check -recursive -diff
      - name: init без бэкенда
        working-directory: terraform
        run: tofu init -backend=false -input=false
      - name: validate
        working-directory: terraform
        run: tofu validate
